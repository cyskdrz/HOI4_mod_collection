 dmitry_medvedev_text: "让§B统一俄罗斯党§!在后普京时代的选举中胜选。\n\n梅德韦杰夫有两条可选路线：§R铁腕§!线需要完成国策§Y$SOV_push_back_the_west$§!；\n\n§C改革§!线则要完成国策§Y$SOV_putinism_with_human_face$§!。(该路线的§Y$SOV_dmitry_medvedev$§!将在赢得§1第一次欧陆战争§!后§R辞去§!总统职务)。"
 vladislav_surkov_text: "走§R铁腕梅德韦杰夫§!线并完成以下国策: §Y$SOV_deals_with_oligarchs$§!、§Y$SOV_send_humanitarian_aid$§!、§Y$SOV_loosen_media_restrictions$§!以及§Y$SOV_celebrate_putins_legacy$§!。完成国策§Y$SOV_celebrate_putins_legacy$§!后，§YVladislav Surkov§!将会成为§Y内务部长§!。\n\n达成上述条件并赢得§1第一次欧陆战争§!后，事件§Y$russia.414.t$§!中将出现选项§Y$russia.414.f$§!。"
 alexander_lukashenko1_text: "走§R铁腕梅德韦杰夫§!线并完成国策§Y$SOV_send_military_equipment$§!和§Y$SOV_nationalize_oligarch_industries$§!。\n\n在赢得§1第一次欧陆战争§!后，事件§Y$russia.414.t$§!中将出现选项§Y$russia.414.c$§!。"

 boris_nadezhdin_text: "走§R铁腕梅德韦杰夫§!线并完成国策：§Y$SOV_loosen_media_restrictions$§!、§Y$SOV_nationalize_oligarch_industries$§!。同时§Y$SOV_Nadezhdin$§!需担任§Y政府首脑§!职务，要任命他需要先执行决议§Y$SOV_cooperate_with_liberals_onf$§!（该决议在赢得§1第一次欧陆战争§!并触发事件§Y$russia.551.t$§!后可用）。特别注意§R不要§!执行决议§Y$SOV_suppress_liberal_dissent$§!。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.414.t$§!中将出现§Y$russia.414.e$§!选项。"
 nadezhdin_heir_text: "走$SOV_Nadezhdin$线，完成国策：§Y$SOV_comprehensive_political_integration$§!、§Y$SOV_defeat_political_apathy$§!。完成上述国策后将出现决议§Y$SOV_operation_heir$§!，执行该决议需先赢得§R第二次欧陆战争§!。\n\n决议完成后将触发事件§Y$russia.861.t$§!，可选的继承者有：\n§Y$SOV_Darya_Besedina_char$§!、§Y$SOV_Dmitry_Kisiev_char$§!以及§Y$SOV_maksim_katz$§!。\n\n\n要让§Y$SOV_Darya_Besedina_char$§!成为继承者，需在事件§Y$russia.859.t$§!中选择§Y$russia.859.a$§!；\n要让§Y$SOV_Dmitry_Kisiev_char$§!成为继承者，需选择§Y$russia.859.b$§!；\n要让§Y$SOV_maksim_katz$§!成为继承者，需完成国策§Y$SOV_state_corporations_liberalization$§! 并且§R不要§!执行决议§Y$SOV_political_experience_young_politicians$§!。"

 zakhar_prilepin_text: "走§C改革派梅德韦杰夫§!线。\n\n赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞去总统职务并开展选举。支持§t人民俄罗斯§!，并将权力平衡维持在$SOV_people_russia_electoral_approval_very_good$范围内。\n\n还可以完成§Y$SOV_med_red_dawn$§!国策，这将触发事件§Y$russia.523.t$§!，选择§Y$russia.523.a$§!(可选)。\n\n最终，在事件§Y$russia.454.t$§!中，将出现§Y$russia.454.f$§!选项。"
 nikolay_platoshkin_text: "走§C改革派梅德韦杰夫§!线。\n\n在赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞去总统职务并开展选举。支持§t人民俄罗斯§!，并将权力平衡维持在$SOV_people_russia_electoral_approval_very_good$范围内，并完成国策§Y$SOV_med_red_dawn$§!以触发事件§Y$russia.523.t$§!，在此事件中必须选择选项§Y$russia.523.c$§!。\n\n最终，在事件§Y选举结果!§!中，将出现选项§Y$russia.454.f2$§!。"
 alexander_lukashenko2_text: "走§C改革派梅德韦杰夫§!线并完成国策§Y$SOV_send_humanitarian_aid$§!。之后需确保触发事件§Y$russia.406.t$§!(完成国策后，该事件立即触发的概率为§Y50%§!)。\n\n在赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞职并开展选举。支持§t人民俄罗斯§!，将权力平衡维持在$SOV_people_russia_electoral_approval_very_good$范围内，并完成国策§Y$SOV_med_red_dawn$§!以触发事件§Y$russia.523.t$§!，并选择§Y$russia.523.b$§!(仅当触发事件§Y$russia.406.t$§!后可用)。\n\n最终，在事件§Y$russia.454.t$§!中，将出现选项§Y$russia.454.f1$§!。"
