 trump_text: "作为§Y特朗普§!进行游戏，在游戏开始时，在事件§Y$usa.126.t$§!中选择§Y$usa.126.a$§!。然后，在§R内战§!开始前的事件§Y$usa.105.t$§!中需要选择§Y$usa.105.a$§!，之后国家将变为§Y$USC$§!。\n\n除了§L$USA_trumpist_populism$§!，§Y特朗普§!还有以下几种可选的意识形态:\n\n1.\n如果走政治国策树的§Y中间§!分支，完成国策§Y$USC_maintain_the_balance$§!并将权力平衡移动到§Y$USC_military_total_control_range$§!，子意识形态将变为§L$trumpism_conservative$§!。\n\n2.\n如果走政治国策树的§Y左侧§!分支，完成国策§Y$USC_console_the_congress$§!并完成政治线的最终国策，执政党将变为§Y$USC_market_liberal_party_short$§!，意识形态变为§Y$market_liberal_noun$§!，子意识形态变为§l$right_libertarianism$§!。\n\n3.\n随后，如果将权力平衡移动到§Y$USC_military_total_control_range$§!，子意识形态将变为§l$trumpism_market$§!。\n\n4.\n如果走政治国策树的§Y右侧§!分支，完成国策§Y$USC_mediate_with_the_military$§!并完成政治线的最终国策，执政党将变为§g$USC_authoritarian_democrat_party_short$§!，意识形态变为§g$authoritarian_democrat_noun$§!，子意识形态变为§g$USA_paternal_trumpism$§!。\n\n5.\n随后，如果将权力平衡移动到§Y$USC_military_total_control_range$§!，子意识形态将变为§g$trumpism_authdem$§!。\n\n6.\n如果将权力平衡移动到§Y$USC_state_sec_total_control_range$§!，子意识形态将变为§g$USC_managed_democracy$§!。"
