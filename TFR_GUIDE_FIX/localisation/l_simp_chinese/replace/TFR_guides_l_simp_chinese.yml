 buttigeg_text: "作为§Y拜登§!进行游戏，完成国策§Y$USB_pass_the_equality_act$§!或§Y$USB_encourage_liberal_warhawks$§!，并且§Y$USB_joe_biden_char$§!必须辞职(或让拜登的§Y健康状况§! §R下降§!到§Y$hos_foggy_as_a_mirror$§!，或在§Y$usb.52.t$§!败选)。\n\n然后在事件§Y$usb.57.t$§!中，选择§Y$usb.57.i$§!。\n\n最后，在事件§Y$usb.115.t$§!中选择§Y$usb.115.i$§!。"
