 #Additional Text
 dmitry_medvedev_additional_text: "\n\n\n\n在走完§R铁腕梅德韦杰夫§!线并赢得§1第一次欧陆战争§!后，将解锁决议§Y$SOV_oligarchs_question_decision$§!。选择后，事件§Y$russia.195.t$§!将会触发。\n\n如果选择选项§Y$russia.195.b$§!，子意识形态将变为§3$SOV_putinist_orthodoxy$§!；\n如果选择§Y$russia.195.a$§!，意识形态将切换为§2$conservative_noun$§!，子意识形态变为§4$putinism$§!。"
 boris_nadezhdin_additional_text: "\n\n\n\n\n\n§Y纳杰日金§!有§R3个互斥国策§!。\n1. §Y$SOV_comprehensive_political_integration$§! - 完成后执政党将变为§Y$SOV_nadezhdin_soclib_short$§!，意识形态变为§O社会自由主义§!，子意识形态变为§L$centrist_pluralism$§!。\n2. §Y$SOV_concept_moderate_center$§! - 完成后政治局势不会改变。\n3. §Y$SOV_nadezhdin_new_vertical$§! - 完成后执政党将变为§Y$SOV_nadezhdin_apf_loyalists_short$§!。同时会解锁决议§Y$SOV_leave_onf$§!。若该决议完成时§Y市场自由主义§!支持率≥40%，将触发事件§Y$russia.844.t$§!，需要为纳杰日金的政党选择名称，可选项如下：§Y$russia.844.a$§!、§Y$russia.844.b$§!、§Y$russia.844.c$§!、§Y$russia.844.e$§!、§Y$russia.844.f$§!。若§Y市场自由主义§!支持率<40%，将触发事件§Y$russia.850.t$§!和§Y$russia.851.t$§!，之后政党名称将变为§Y$SOV_nadezhdin_fight_short$§!。同时会出现决议§Y$SOV_declare_duma_reelection$§!，执行后将触发事件§Y$russia.849.t$§!和§Y$russia.844.t$§!。"
 andrey_belousov_additional_text: "\n\n\n\n\n\n\n2.\n\n来自§B反动派系§!的候选人——§Y$SOV_Sergey_Shoygu$§!或§Y$SOV_sergei_naryshkin$§!——必须赢得选举。\n\n完成国策§Y$SOV_subdue_two_party_system$§!后，将启动对§Y现任总统§!的§R弹劾程序§!，并触发任务§Y$SOV_duma_opposition_organization$§!。\n\n超时后，将触发事件§Y$russia.737.t$§!，§Y$SOV_Belousov$§!将成为总统。"
 yuri_afonin_additional_text: "\n\n\n在赢得§1第一次欧陆战争§!后，将举行§Y$SOV_soviet_election$§!。\n\n要确保§Y$SOV_yuri_afonin$§!获胜，需满足以下条件：\n- 权力平衡必须处于$SOV_old_guard_dominant_range$或更高范围；\n- §R守旧派§!必须是执政党。"
 leonid_pasechnik_additional_text: "\n\n\n\n\n\n\n§G*§!要解锁决议§Y$SOV_old_guard_party_state_centralization$§!，您必须：\n1) 完成国策：§Y$SOV_enshrine_democratic_centralism$§!和§Y$SOV_cooperate_with_the_church$§!。\n2) 执行决议§Y$SOV_old_guard_support_pragmatic_statesmen$§!。之后，将解锁决议§Y$SOV_old_guard_party_state_centralization$§!。同时，不要执行决议§Y$SOV_old_guard_mimic_chinese_model$§!。§G*§!要解锁决议§Y$SOV_formulate_new_ideologeme$§!，必须达成以下条件：\n1) 在选举期间，通过执行决议§Y$SOV_cprf_srzp_union$§!与§t公正俄罗斯§!结盟。\n2) 在事件§Y$russia.420.t$§!中选择§Y$russia.420.b$§!\n3) 在事件§Y$russia.590.t$§!中选择§Y$russia.590.b$§!\n4) 完成国策§Y$SOV_create_ADS$§!、§Y$SOV_red_east$§!，并执行决议§Y$SOV_invite_dprk_to_ads$§!。\n5) 执行决议：§Y$SOV_study_juche_methods$§!、§Y$SOV_old_guard_canonize_stalin$§!（在杜金事件后可用，并完成§R守旧派§!分支直至最终国策§Y$SOV_cooperate_with_the_church$§!）。达成上述条件后，将解锁决议§Y$SOV_formulate_new_ideologeme$§!。重要的是，§R不要§!完成国策§Y$SOV_adapt_to_chinese_socialism$§!。"
 alexander_lukashenko3_additional_text: "\n\n\n\n\n\n\n\n\n\n\n\n\n\n§G*§!要解锁决议§Y$SOV_old_guard_support_pragmatic_statesmen$§!，请完成国策§Y$SOV_cooperate_with_the_church$§!。§G*§!要解锁决议§Y$SOV_formulate_new_ideologeme$§!，需要达成以下条件：\n\n1) 在选举期间，执行决议§Y$SOV_cprf_srzp_union$§!以便与§t公正俄罗斯§!结盟。\n\n2) 在事件§Y$russia.420.t$§!中选择§Y$russia.420.b$§!\n\n3) 在事件§Y$russia.590.t$§!中选择§Y$russia.590.b$§!\n\n4) 完成国策§Y$SOV_create_ADS$§!、§Y$SOV_red_east$§!，并执行决议§Y$SOV_invite_dprk_to_ads$§!。\n\n5) 执行决议：§Y$SOV_study_juche_methods$§!、§Y$SOV_old_guard_canonize_stalin$§!（在杜金事件后可用，并完成§R守旧派§!分支直至最终国策§Y$SOV_cooperate_with_the_church$§!）。达成上述条件后，将解锁决议§Y$SOV_formulate_new_ideologeme$§!。重要的是，§R不要§!完成国策§Y$SOV_adapt_to_chinese_socialism$§!。"
 valery_rashkin_additional_text: "\n\n\n在赢得§1第一次欧陆战争§!后，最终将举行§Y$SOV_soviet_election$§!选举。要使§Y$SOV_valery_rashkin$§!获胜，权力平衡必须处于$SOV_new_guard_dominant_range$或更高范围，且§t拉什金集团§!必须是执政党。"
 valery_gerasimov_additional_text: "§Y格拉西莫夫§!有§R两个互斥国策§!。\n\n1. §Y$SOV_keep_control$§! - 完成后，意识形态将变为§R$totalitarian_socialist_noun$§!，子意识形态变为§R$left_wing_junta$§!。\n\n2. §Y$SOV_return_power_to_rashkin$§! - 完成后，拉什金将重新成为领导人。"
 viktor_zolotov_additional_text: "§Y佐洛托夫§!有§R两个互斥国策§!。\n\n1. §Y$SOV_army_with_empire$§!——完成后将触发事件§Y$russia.365.t$§!。如果选择§Y$russia.365.a$§!，执政党将变为§g$SOV_zolotov_zhir_party$§!，意识形态变为§8法西斯主义§!，子意识形态变为§g$vladimir_zhirinovsky_thought_militarist$§!。\n\n如果选择§Y$russia.365.b$§!，执政党将变为§g$SOV_zolotov_mil_party$§!。\n\n2. §Y$SOV_shepard_with_sheep$§!——完成后将举行§Y$russia.360.t$§!，其中§Y$SOV_viktor_zolotov$§!将获胜。执政党将变为§g$SOV_zolotov_chungus_party$§!，意识形态变为§g$authoritarian_democrat_noun$§!，子意识形态变为§g$military_democracy$§!。"
 ivan_okhlobystin_additional_text: "§Y$POST_RUSSIA_Ivan_Okhlobystin$§!也有§R2个互斥的国策§!。\n\n1. §Y$SOV_on_line_with_kirill$§!——完成后将维持当前政体。\n\n2. §Y$SOV_ally_with_hardline_priesthood$§!——完成后，意识形态将变为§8$fascist_noun$§!，子意识形态变为§8$clerical_fascism$§!。"

 zemsky_sobor_additional_text: "\n\n\n\n\n\n\n\n在§Y$russia.269.t$§!事件后，将召开§Y缙绅会议§!，共有3位皇位候选人：\n\n§Y$SOV_Grigory_Romanov$§!和§Y$SOV_Rostislav_Romanov$§!——默认可用。\n\n§Y$SOV_Gavril_Romanov$§!——§1第一次欧陆战争§!开始后，在事件§Y$russia.362.t$§!中选择§Y$russia.362.a$§!，则可在缙绅会议中选择该候选人。\n\n§Y$SOV_Grigory_Romanov$§!将会走向§g$absolute_monarchist$§!；§Y$SOV_Rostislav_Romanov$§!则会走向§C君主立宪制§!。\n\n§Y$SOV_Gavril_Romanov$§!则可以走§g$absolute_monarchist$§!和§C君主立宪制§!两条路线。"
 konstantin_zatulin_additional_text: "完成国策§Y$SOV_stabilize_the_administration$§!（位于一欧战后§g自民党§!国策树中）后，将触发一系列事件：§Y$russia.800.t$§!、§Y$russia.340.t$§!，并出现决议§Y$SOV_operation_against_knoa$§!。\n\n若不执行该决议，则在§Y$SOV_konstantin_zatulin_idea$§!赢得§Y$russia.751.t$§!的100天后，会触发事件§Y$russia.818.t$§!。\n\n若选择§Y$russia.818.a$§!，后续事件§Y$russia.819.t$§!将让以下人物之一成为总理：\n\n1. §Y$SOV_Starovoit$§!\n\n2. §Y$SOV_Drozdenko$§!\n\n3. 若在§Y扎图林§!执政期间§R未执行§!决议§Y$SOV_coalition_with_rovs$§!，则可让§Y$SOV_Vodolatsky$§!当选。"
 alexander_dugin_additional_text: "\n\n\n\n\n\n\n\n\n若后续完成国策§Y$SOV_soviet_nostalgia$§!，执政党将变为§R$SOV_eurasia_party_left_long$§!，意识形态转为§R$totalitarian_socialist_noun$§!，并保留子意识形态§t$eurasianism$§!。"
 leonid_slutsky_additional_text: "\n\n\n\n\n\n此外，§Y斯卢茨基§!有§R两个互斥国策§!。\n\n1. §Y$SOV_political_tutelage$§! - 完成该国策后政治路线不会改变。\n\n2. §Y$SOV_secure_russian_democracy$§!，完成此国策后国家将开展选举，并且§Y斯卢茨基§!将会§G参选§!。"
 alexei_navalny2_additional_text: "\n\n\n\n\n\n\n\n\n§Y$SOV_alexei_navalny$§!除§Y$russian_patriotic_populism$§路线!外还有以下几种路线：\n\n1.\n\n若选择国策树左侧分支中的国策§Y$SOV_seize_the_majority_in_duma$§!并完成§Y$SOV_political_bonapartism$§!，将出现决议§Y$SOV_mimicking_our_past$§!。完成后，执政党将变为§g$SOV_nav_authdem_party_long$§!，意识形态转为§g$authoritarian_democrat_noun$§!，子意识形态变为§L$russian_patriotic_meritocracy$§!。\n\n2.\n\n§R第二次欧陆战争§!爆发后，可执行决议§Y$SOV_nav_organise_terrorists$§!。随后将出现新决议§Y$SOV_ultranationalist_coup$§!（需满足§8$fascist$§!支持率>35%且§R未执行§!决议§Y$SOV_mimicking_our_past$§!）。完成该决议后，执政党将变为§g$SOV_nav_fascist_party_long$§!，意识形态转为§8$fascist_noun$§!，子意识形态变为§n$ultranationalism$§!。"

 #GER
 frank_franz_additional_text: "\n\n\n此外，§Y$GER_frank_franz$§!有一条§n$GER_national_socialism$§!路线，为此需要: \n\n1. 完成国策§Y$GER_true_to_form$§!\n\n2. 令§n$national_socialist_noun$§!的支持率 > 10%。\n\n3. 完成国策§Y$GER_germany_everlasting$§!\n\n随后，在事件§Y$germany.238.t$§!中需要选择§Y$germany.238.a$§!\n\n随后政党的名称将变为§n$GER_nsdap$§!，意识形态和子意识形态将变为§n$national_socialist_noun$§!。"
 
 #FRANCE#
 faure_additional_text: "\n\n\n\n如果将权力平衡移动到$FRA_socialists_total_control_range$，则子意识形态将变为§p$progressivism$§!。"
 melenchon_additional_text: "\n\n\n\n如果将权力平衡移动到$FRA_unbowed_total_control_range$，则意识形态将变为§t$libertarian_socialist_noun$§!，子意识形态变为§A$FRA_socialist_souverainism$§!\n\n如果在俄罗斯掌权的是§R$SOV_communist_short$§!或§g$SOV_authoritarian_democrat_short$§!，最终§Y梅朗雄§!政府会被§Y军事政变§!推翻，有三种结果: \n\n1. 如果稳定性 >= 60%，则一位拥有§Y$trait_FRA_Loyal_to_Republic$§!特质的随机军队将领，将成为临时统治者，意识形态为§B$supervised_democracy$§!\n\n2. 如果稳定性 > 30% 且 < 60%，则一位拥有特质§Y$trait_FRA_Loyal_to_Republic$§!或§Y$trait_FRA_Loyal_to_Military$§!的随机军队将领，将成为临时统治者，意识形态为§g$military_democracy$§!\n\n3. 如果稳定性 < 30%，则一位拥有特质§Y$trait_FRA_Loyal_to_Military$§!的随机军队将领，将成为临时统治者，意识形态为§a$military_junta$§!\n\n\n为了让§Y$FRA_Jean_Luc_Melenchon_char$§!在政变后继续担任统治者，政变必须在稳定性 > 30%时进行(结果1或2)。在§1第一次欧陆战争§!胜利后，必须§G恢复§!§Y第六共和国§!/§G维持§!§Y梅朗雄宪法§!，在随后的事件§Y$france.217.t$§!中选择§Y$france.217.a$§!。" 

