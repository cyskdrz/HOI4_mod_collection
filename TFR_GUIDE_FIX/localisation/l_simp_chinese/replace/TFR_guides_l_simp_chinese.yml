 biden_text: "作为§Y拜登§!进行游戏，在游戏开始时，在事件§Y$usa.126.t$§!中选择§Y$usa.126.b$§!。然后，在§R内战§!开始之前，在事件§Y$usa.105.t$§!中，选择§Y$usa.105.b$§!，之后国家将变为§Y$USB$§!。\n\n为了让§Y$USB_joe_biden_char$§!在2024年选举中竞选总统，必须保持§Y拜登的健康§!在§G高水平§!，以及以下条件之一: \n\n1. §Y$USC$§! 投降进度 > 50% 或§R不存在§!，拜登的健康状况§Y$hos_fit_as_a_fiddle$§!，§p进步派§!和§B保守派§!派别在联盟中。\n\n2. §Y$USC$§! 投降进度在20%到50%之间，§p进步派§!和§B保守派§!在联盟中。\n\n3. §Y$USC$§! 投降进度 > 60% 或§R不存在§!，§p进步派§!和§B保守派§!§R不在§!联盟中。\n\n如果条件满足且§Y拜登§! §R没有§! 辞职，那么在事件§Y$usb.115.t$§!中选项§Y$usb.115.n$§!将可用。"
 cortez_text: "作为§Y拜登§!进行游戏。§Y谁赢得§Y2024年选举§!并不重要，主要是§p$social_democrat_noun$§!派别§Y保持在联盟中§!。\n\n然后，在§Y2028年选举§!之前，在事件§Y$usb.57.t$§!中，选择§Y$usb.57.f$§!。\n\n最后，在事件§Y$usb.115.t$§!中选择§Y$usb.115.f$§!。"
 bloomberg_text: "作为§Y拜登§!进行游戏。\n\n有3条路线: \n\n1.\n\n完成国策§Y$USB_a_hand_on_our_shoulder$§!并让§Y$USB_joe_biden_char$§!辞职(或当§Y健康§! §R下降§!到§Y$hos_foggy_as_a_mirror$§!，或在§Y$usb.52.t$§!败选)。\n然后在事件§Y$usb.57.t$§!中选择§Y$usb.57.a$§!。\n最后，在事件§Y$usb.115.t$§!中选择§Y$usb.115.a$§!。\n\n2.\n\n完成国策§Y$USB_blow_the_whistle$§!，并且还必须满足以下条件之一: §g革新派§!的支持率 > 20%，拥有国家精神§Y$USB_high_corporate_influence_idea$§!，拥有国家精神§Y$USB_higher_corporate_influence_idea$§!。\n然后，在事件§Y$usb.115.t$§!中选择§Y$usb.115.k$§!。\n\n3.\n\n走经济左线，完成国策§Y$USB_the_unification_deal$§!并将§Y企业影响力§!提高到96%。\n最终会触发事件§Y$usb.17.t$§!。"
