 sergey_naryshkin_text: "走§C改革派梅德韦杰夫§!线。\n\n赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞去总统职务并开始选举。支持§B统一俄罗斯党§!，将权力平衡维持在$SOV_united_russia_electoral_approval_very_good$范围内，并完成国策§Y$SOV_medvedev_path$§!，这将触发事件§Y$russia.521.t$§!，选择§Y$russia.521.c$§!。此外，§Y$SOV_Belousov$§!必须§R不担任§!国防部长职务，否则事件中不会出现必要选项。\n\n最终，当事件§Y$russia.454.t$§!触发时，选项§Y$russia.454.b2$§!将会可用。"
 dmitry_patrushev_text: "走§C改革派梅德韦杰夫§!线。\n\n赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞去总统职务并开始选举。支持§B统一俄罗斯党§!并将权力平衡维持在$SOV_united_russia_electoral_approval_ok$范围内。\n\n也可以完成国策§Y$SOV_people_program$§!，这将触发事件§Y$russia.520.t$§!，选择§Y$russia.520.a$§!（可选）。\n\n最终，当事件§Y$russia.454.t$§!触发时，选项§Y$russia.454.a$§!将会可用。"
 sergey_sobyanin_text: "走§C改革派梅德韦杰夫§!线。\n\n赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞去总统职务并开始选举。支持§B统一俄罗斯党§!，将权力平衡维持在$SOV_united_russia_electoral_approval_ok$范围内，并完成国策§Y$SOV_people_program$§!，这将触发事件§Y$russia.520.t$§!，选择§Y$russia.520.b$§!。\n\n最终，当事件§Y$russia.454.t$§!触发时，选项§Y$russia.454.a1$§!将会可用。"
 mikhail_mishustin_text: "走§C改革派梅德韦杰夫§!线。\n\n赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞去总统职务并开始选举。支持§B统一俄罗斯党§!，将权力平衡维持在$SOV_united_russia_electoral_approval_ok$范围内，并完成国策§Y$SOV_people_program$§!，这将触发事件§Y$russia.520.t$§!，选择§Y$russia.520.c$§!。\n\n最终，当事件§Y$russia.454.t$§!触发时，选项§Y$russia.454.a2$§!将会可用。"
 andrey_belousov_text: "走§C改革派梅德韦杰夫§!线。\n\n赢得§1第一次欧陆战争§!并完成国策§Y$SOV_future_russia$§!后，§Y$SOV_dmitry_medvedev$§!将辞去总统职务并开始选举。支持§B统一俄罗斯党§!，将权力平衡维持在$SOV_united_russia_electoral_approval_ok$范围内，并完成国策§Y$SOV_people_program$§!，这将触发事件§Y$russia.520.t$§!，选择§Y$russia.520.e$§!。通过国策§Y$SOV_improve_gerasimovs_doctrine$§!将§Y$SOV_Belousov$§!§G任命§!为国防部长，否则必要选项不会出现。\n\n最终，当事件§Y$russia.454.t$§!触发时，选项§Y$russia.454.a3$§!将会可用。"
 andrey_vorobyov_text: "走§C改革派梅德韦杰夫§!线。\n\n然后，让§B保守派§!的候选人§Y$SOV_Volodin$§!在战后选举中胜选。完成国策§Y$SOV_subdue_two_party_system$§!后，将启动对§Y现任总统§!的§R弹劾程序§!，并出现任务§Y$SOV_duma_opposition_organization$§!。任务超时后，事件§Y$russia.737.t$§!将触发，§Y$SOV_andrey_vorobyov$§!将成为总统。"
 
 yuri_afonin_text: "§R俄共§!的§Y候选人§!必须为§Y$SOV_gennady_zyuganov$§!、§Y$SOV_yuri_afonin$§!或§Y$SOV_nikolay_kharitonov$§!，并在后普京时代的选举中胜选。要提名§Y$SOV_yuri_afonin$§!或§Y$SOV_nikolay_kharitonov$§!，必须完成选举国策中的§Y$SOV_spread_cprf_leaflets$§!，否则候选人将是§Y$SOV_gennady_zyuganov$§!。\n\n在§R俄共§!胜选后，完成国策§Y$SOV_restore_the_1977_constitution$§!。"
 leonid_pasechnik_text: "必须满足以下条件：\n1) 必须在游戏开始后立刻成立§Y新俄罗斯§!（通过国策§Y$SOV_assist_our_novorossiyan_allies$§!和随后的决议§Y$SOV_push_for_novorossiyan_unification$§!成立），且§Y$SOV_leonid_pasechnik$§!必须为新俄罗斯的领导人。\n2) 必须让§R俄共-守旧派§!掌权。\n3) 必须执行决议§Y$SOV_old_guard_party_state_centralization$§!§G§!和§Y$SOV_formulate_new_ideologeme$§!§G§!。\n4) 完成国策§Y$SOV_developed_socialism$§!和§Y$SOV_appoint_new_gosplan_head$§!，并且将§Y$SOV_Galushka$§!任命为国家计划委员会主席。\n5) §R不要§!执行决议§Y$SOV_utilize_nazbol$§!和§Y$SOV_utilize_antifa$§!。\n满足上述所有条件并赢得§1第一次欧陆战争§!后，§Y$SOV_leonid_pasechnik$§!可以赢得§Y$SOV_soviet_election$§!。"
 alexander_lukashenko3_text: "走§R俄共-守旧派§!线。在赢得§1第一次欧陆战争§!后，将举行§Y$SOV_soviet_election$§!。权力平衡必须不低于$SOV_old_guard_dominant_range$，以确保§Y$BLR_alexander_lukashenko$§!获胜。\n\n§Y卢卡申科§!线有§R3个互斥国策§!：\n\n1. §Y$SOV_save_the_best$§! - 默认可用。完成后，政党将从§R守旧派§!更名为§R卢卡申科派§!。\n\n2. §Y$SOV_gospodin_president$§! - 要解锁此国策，需执行决议§Y$SOV_old_guard_support_pragmatic_statesmen$§!§G*§!并完成国策§Y$SOV_adapt_to_chinese_socialism$§!。完成后，执政党变为§R$SOV_true_federation_lukashenkites_long$§!，意识形态变为§g$authoritarian_democrat_noun$§!，子意识形态变为§t$SOV_pragmatic_socialism$§!。\n\n3. §Y$SOV_iron_hand$§! - 要解锁此国策，需按照指南中的步骤以解锁决议§Y$SOV_formulate_new_ideologeme$§!（并执行它）§G*§!。完成后，执政党变为§R共产党联盟/CPSU-卢卡申科派§!，意识形态变为§R$totalitarian_socialist_noun$§!，子意识形态变为§g$SOV_lukashenko_thought$§!。"
 leonid_zyuganov_text: "走§R俄共-守旧派§!线。在赢得§1第一次欧陆战争§!后，§Y$SOV_yuri_afonin$§!必须赢得§Y$SOV_soviet_election$§!。然后完成国策§Y$SOV_father_of_our_party$§!、§Y$SOV_his_blood$§!并执行决议§Y$SOV_make_the_switch$§!。"
 pavel_grudinin2_text: "走任意§R俄共§!线，并在赢得§1第一次欧陆战争§!后的§Y$SOV_soviet_election$§!中选择§Y$russia.247.h$§!。"
 valery_rashkin_text: "§R俄共§!的§Y候选人§!必须是§Y$SOV_gennady_zyuganov$§!、§Y$SOV_sergey_levchenko$§!或§Y$SOV_nikolay_kharitonov$§!，并在后普京时代的选举中获胜。完成选举国策中的§Y$SOV_spread_cprf_leaflets$§!后，才可以提名§Y$SOV_sergey_levchenko$§!和§Y$SOV_nikolay_kharitonov$§!，否则候选人将是§Y$SOV_gennady_zyuganov$§!。\n\n在§R俄共§!胜选后，完成国策§Y$SOV_draft_new_constitution$§!。"
 sergey_levchenko_text: "权力平衡必须在$SOV_new_guard_dominant_range$及以上，且执政党必须是§t拉什金集团§!。如果满足这些条件，§Y$SOV_sergey_levchenko$§!可以赢得§Y$SOV_soviet_election$§!。"
 denis_parfenov_text: "§Y$SOV_sergey_levchenko$§!必须赢得§Y$SOV_soviet_election$§!。然后：\n1) 完成国策§Y$SOV_reform_the_party$§!\n2) 在事件§Y$russia.543.t$§!中选择§Y$russia.543.b$§!\n3) 完成国策§Y$SOV_find_compromise$§!\n4) 在事件§Y$russia.542.t$§!中选择§Y$russia.542.b$§!\n5) 完成国策§Y$SOV_our_democratic_spirit$§!\n\n一段时间后，将会出现事件§Y$russia.544.t$§!。选择§Y$russia.544.a$§!。"
 nikolay_bondarenko_text: "§Y$SOV_sergey_levchenko$§!必须赢得§Y$SOV_soviet_election$§!。然后：\n1) 完成国策§Y$SOV_reform_the_party$§!\n2) 在事件§Y$russia.543.t$§!中选择§Y$russia.543.b$§!\n3) 完成国策§Y$SOV_find_compromise$§!\n4) 在事件§Y$russia.542.t$§!中选择§Y$russia.542.b$§!\n5) 完成国策§Y$SOV_our_democratic_spirit$§!\n\n一段时间后，将会出现事件§Y$russia.544.t$§!。选择§Y$russia.544.b$§!。"
 vladimir_solovyov_text: "\n1) 游戏开始时完成国策§Y$SOV_the_navalny_fifth_column$§!和§Y$SOV_focus_on_corruption$§!\n2) 执政党必须是§t拉什金集团§!\n3) 完成国策§Y$SOV_class_unity$§!和§Y$SOV_mobilize_the_youth$§!\n4) 执行决议§Y$SOV_new_guard_support_pluralism$§!\n5) 在事件§Y$russia.226.t$§!中选择§Y$russia.226.a$§!\n6) 在事件§Y$russia.528.t$§!中选择§Y$russia.528.a$§!\n7) 权力平衡必须维持在$SOV_new_guard_influence_range$及以上范围\n\n如果满足所有条件，§Y$SOV_Vladimir_Solovyov$§!可以赢得§Y$SOV_soviet_election$§!。"
 alexei_navalny_text: "\n1) 游戏开始时§R不要§!完成国策§Y$SOV_the_navalny_fifth_column$§!和§Y$SOV_focus_on_corruption$§!\n2) 在事件§Y$russia.422.t$§!中选择§Y$russia.422.a$§!\n3) 在事件§Y$russia.167.t$§!中选择§Y$russia.167.c$§!\n4) 执政党必须是§t拉什金集团§!\n5) 完成国策§Y$SOV_class_unity$§!\n6) 至少执行三次决议§Y$SOV_utilize_antifa$§!\n7) 执行决议§Y$SOV_new_guard_new_soviet_republic$§!（在完成国策§Y$SOV_empower_congress_of_soviets$§!后出现）\n8) 在事件§Y$russia.226.t$§!中选择§Y$russia.226.b$§!\n9) 在特别军事行动开始后，必须触发§Y$russia.238.t$§!\n10) 赢得§1第一次欧陆战争§!后，完成国策§Y$SOV_free_interpretation_of_socialism$§!和§Y$SOV_renewed_federation$§!\n11) 权力平衡必须达到$SOV_new_guard_total_control$\n\n如果满足所有条件，§Y$SOV_alexei_navalny$§!可以赢得§Y$SOV_soviet_election$§!。"
 valery_gerasimov_text: "让§Y$SOV_alexei_navalny$§!赢得§Y$SOV_soviet_election$§!。然后通过完成国策§Y$SOV_break_with_communists$§!进入右侧分支。当权力平衡达到§Y$SOV_navalnytes_dominant_range$§!时，将会触发事件§Y$russia.386.t$§!。"

 vladimir_zhirinovsky_text: "让§L自由民主党§!在后普京时代的选举中胜选。\n\n\n\n§C改革派§!路线需要完成国策§Y$SOV_implement_party_programm$§!；§8鹰派§!路线则需完成国策§Y$SOV_populist_revolution$§!。"
 viktor_zolotov_text: "让§L自由民主党§!在后普京时代的选举中胜选。权力平衡必须保持在£GFX_hawks §8鹰派§!和£GFX_reformists §C改革派§!双方都低于50%——任何一方都不能控制半数以上。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$!§!中将出现§Y$russia.269.g$§!选项。"
 alexander_starovoitov_text: "让§L自由民主党§!在后普京时代的选举中胜选。完成国策§Y$SOV_transform_oligarchy$§!，且权力平衡必须倾向于£GFX_hawks §8鹰派§!>35%。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$!§!中将出现§Y$russia.269.l3$§!选项。"
 alexander_sherin_text: "让§L自由民主党§!在后普京时代的选举中胜选。完成国策§Y$SOV_national_totalitarianism$§!，并采取§Y$SOV_revival_pan_slavism$§!或§Y$SOV_embarace_reactionaryism$§!两项决定中的一项。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$!§!中将出现§Y$russia.269.k$§!选项。"
 ivan_okhlobystin_text: "让§L自由民主党§!在后普京时代的选举中胜选。完成国策§Y$SOV_orthodoxy_supreme$§!，且§Y内务部长§!必须由§Y$SOV_Tihon$§!或§Y$SOV_Illarion$§!担任。权力平衡还必须在§Y$SOV_ldpr_middle$§!范围内。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$!§!将出现§Y$russia.269.l$§!选项。"
 sergei_kurginyan_text: "让§L自由民主党§!在后普京时代的选举中胜选，且完成§Y$SOV_national_totalitarianism$§!国策，执行决议§Y$SOV_allies_on_the_left$§!，并且保持§R极权社会主义§!的支持率>14%(支持率可通过执行决议§Y$SOV_allies_on_the_left$§!后出现的选项提升)，同时权力平衡需处于§Y$SOV_ldpr_middle$§!范围内。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$§!中将出现选项§Y“$russia.269.l1$”§!。"
 leonid_slutsky_text: "让§L自由民主党§!在后普京时代的选举中胜选，并满足以下条件之一: \n1) §Y斯卢茨基§!担任§Y政府首脑§!(通过国策§Y$SOV_implement_party_programm$§!任命)，权力平衡处于§Y$SOV_ldpr_middle$§!范围内。\n\n2) 权力平衡处于倾向于£GFX_reformists §C改革派§! > 50% 。\n\n并且§R不要§!执行决议§Y$SOV_revival_pan_slavism$§!和§Y$SOV_embarace_reactionaryism$§!。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$§!中将出现选项§Y“$russia.269.e$”§!。"
 dmitry_rogozin_text: "让§L自由民主党§!在后普京时代的选举中胜选。\n\n赢得§1第一次欧陆战争§!后，在事件§Y$russia.269.t$§!中必须让§Y斯卢茨基§!掌权。接着需要完成国策§Y$SOV_national_presidency$§!和§Y$SOV_secure_russian_democracy$§!，随后在事件§Y$russia.763.t$§!中会出现所需选项。"
 roman_yuneman_text: "让§L自由民主党§!在后普京时代的选举中胜选，并完成国策§Y$SOV_national_social_state$§!。\n\n在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$§!中必须让§Y斯卢茨基§!掌权。接着需要完成国策§Y$SOV_empower_the_senate$§!和§Y$SOV_secure_russian_democracy$§!，随后在事件§Y$russia.763.t$§!中会出现对应选项。"
 maxim_shevchenko_text: "让§L自由民主党§!在后普京时代的选举中胜选，并完成国策§Y$SOV_stratocratic_economy$§!和§Y$SOV_transform_oligarchy$§!。\n\n在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$§!中必须让§Y斯卢茨基§!掌权。完成国策§Y$SOV_revising_his_vision$§!的60天后将触发事件§Y$russia.2011.t$§!，需要选择§Y$russia.2011.a$§!。同时还需完成国策§Y$SOV_empower_the_senate$§!、§Y$SOV_secure_russian_democracy$§!，且§Y稳定度§!必须<50%。最终，在事件§Y$russia.763.t$§!中会出现对应选项。"
 andrey_kartapolov_text: "让§Y$SOV_maxim_shevchenko$§!在§Y$russia.763.t$§!中胜选。\n\n在他胜选后，将激活任务§Y$SOV_coming_right_wing_coup_mission$§!，经过一段时间后会触发事件§Y$russia.2012.t$§!。"
 vasily_vlasov_text: "让§L自由民主党§!在后普京时代的选举中胜选。满足以下条件之一：\n1) §Y$SOV_Vlasov$§!担任§Y政府首脑§!（通过国策§Y$SOV_populist_revolution$§!任命），且权力平衡处于§Y$SOV_ldpr_middle$§!范围内。\n\n2) 权力平衡中£GFX_hawks §8鹰派§!支持率超过50%。\n\n同时务必§R不要§!执行决议§Y$SOV_revival_pan_slavism$§!或§Y$SOV_embarace_reactionaryism$§!。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$!§!将出现选项§Y$russia.269.c$§!。"
 viktor_bout_text: "让§L自由民主党§!在后普京时代的选举中胜选。让§Y$SOV_Viktor_Bout$§!担任§Y经济部长§!（在$SOV_Viktor_Bout$离开美国后，等待一段时间，触发事件§Y$russia.286.t$§!，便可将任命他为经济部长），且权力平衡中£GFX_hawks §8鹰派§!支持率超过50%。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$!§!中将出现选项§Y$russia.269.j$§!。"
 zemsky_sobor_text: "让§L自由民主党§!在后普京时代的选举中胜选。满足：\n\n1) §Y$SOV_Slutsky$§!担任§Y政府首脑§!（通过国策§Y$SOV_implement_party_programm$§!任命）。\n\n2) 权力平衡中£GFX_reformists §C改革派§!支持率超过50%。\n\n3) 完成国策§Y$SOV_honor_the_romanovs$§!。\n\n4) 在事件§Y$russia.257.t$§!中（执行决议§Y$SOV_destroy_lenin_tomb$§!后触发），选择第一项：§!$russia.257.a$§!。\n\n最终，在赢得§1第一次欧陆战争§!后，事件§Y$russia.269.t$!§!将出现选项§Y$russia.269.a$§!。"
 anton_bakov_text: "走§C君主立宪制§!线，完成国策§Y$SOV_restore_october_manifesto$§!后，将触发事件§Y$russia.747.t$§!。选择第二项：§Y$russia.747.c$§!。\n\n110天后，在事件§Y$russia.751.t$§!中选择§Y$russia.751.c$§!。\n\n重要提示：巴科夫只会担任总理，国家元首仍由§Y$SOV_Rostislav_Romanov$§!或§Y$SOV_Gavril_Romanov$§!担任。"
 alexander_burkov_text: "走§C君主立宪制§!线，完成国策§Y$SOV_restore_october_manifesto$§!后，将触发事件§Y$russia.747.t$§!。选择第一项：§Y$russia.747.a$§!。\n\n110天后，在事件§Y$russia.751.t$§!中选择§Y$russia.751.h$§!。\n\n重要提示：布尔科夫只会担任总理，国家元首仍由§Y$SOV_Rostislav_Romanov$§!或§Y$SOV_Gavril_Romanov$§!担任。"
 boris_titov_text: "让§Y$SOV_alexander_burkov_idea$§!赢得§Y$russia.751.t$§!。之后将激活任务§Y$SOV_unstable_cabinet_burkov$§!，该任务超时后会触发事件§Y$russia.815.t$§!。\n\n最终§Y$$SOV_Boris_Titov$$§!将成为总理。\n\n重要提示：蒂托夫只会担任总理，国家元首仍由§Y$SOV_Rostislav_Romanov$§!或§Y$SOV_Gavril_Romanov$§!担任。"
 konstantin_zatulin_text: "走§C君主立宪制§!线，并完成§Y$SOV_restore_october_manifesto$§!国策。\n\n在随后的事件§Y$russia.751.t$§!中选择§Y$russia.751.a$§!。\n\n重要提示：扎图林只会担任总理，国家元首仍由§Y$SOV_Rostislav_Romanov$§!或§Y$SOV_Gavril_Romanov$§!担任。"
 vadim_krasnoselsky_text: "要想让§Y$SOV_Krasnoselsky$§!担任总理，需满足：\n\n1) 完成§g自由民主党§!战后国策树中的§Y$SOV_stabilize_the_administration$§!后，将触发事件链：§Y$russia.800.t$§!、§Y$russia.340.t$§!，并解锁决议§Y$SOV_operation_against_knoa$§!——§R不要§!执行该决议。\n\n2) 转向§C君主立宪制§!。\n\n3) 在§Y$russia.751.t$§!中选§Y$SOV_monarch_authdem_party$§!。\n\n4) 执行决议§Y$SOV_coalition_with_rovs$§!。\n\n5) 等待§Y$russia.818.t$§!事件并选择§Y$russia.818.a$§!。\n\n随后在后续事件§Y$russia.819.t$§!中选择§Y$russia.819.a1$§!。"
 zemsky_sobor2_text: "要召开§Y第二次缙绅会议§!，需满足：\n\n1) 在事件§Y召集缙绅会议§!中选择§Y$SOV_Rostislav_Romanov$§!。\n\n2) 完成国策§Y$SOV_restore_october_manifesto$§!150天后，触发事件§Y$russia.902.t$§!，选择§Y$russia.902.b$§!。\n\n3) 在后续事件§Y$russia.903.t$§!中选择§Y$russia.903.a$§!。\n\n之后将触发事件§Y$russia.904.t$§!和§Y$russia.905.t$§!。\n\n若总理为§Y$SOV_konstantin_zatulin_idea$§!，新沙皇将会是§Y$SOV_michael_ii$§!；若总理为§Y$SOV_bakov$§!，则是§Y$SOV_nicholas_iii$§!；若总理为§Y$SOV_alexander_burkov_idea$§!，则是§Y$SOV_alexis_ii$§!。"

 alexander_dugin_text: "§R输掉§!§1第一次欧陆战争§!。\n\n在§B梅德韦杰夫§!路线战败后将触发事件§Y$russia.444.t$§!和§Y$russia.445.t$§!。在后者中选择§Y$russia.445.b$§!，结果§Y普里戈任将被击败§!，完成一小段国策后，§Y$SOV_alexander_dugin$§!将成为统治者。\n\n在§R俄共§!路线中，需选择§t拉什金派§!分支。战败后触发事件§Y$russia.702.t$§!，完成简短国策线后，事件§Y$russia.125.t$§!将使§Y$SOV_alexander_dugin$§!上台。\n\n在§8自民党§!路线中，需选择§C改革派§!分支。战败后触发事件§Y$russia.804.t$§!，完成简短国策树后，事件§Y$russia.125.t$§!将使§Y$SOV_alexander_dugin$§!上台。"
 alexei_navalny2_text: "§R输掉§!§1第一次欧陆战争§!。\n\n在§B梅德韦杰夫§!路线战败后将触发事件§Y$russia.444.t$§!和§Y$russia.445.t$§!。在后者中选择§Y$russia.445.a$§!，结果§Y普里戈任将获胜§!，但随后§Y普里戈任§!会§R遭枪杀§!，并在事件§Y$russia.100.t$§!中由§Y$SOV_alexei_navalny$§!接任。\n\n在§R俄共§!路线中，需选择§R守旧派§!分支。战败后触发事件§Y$russia.700.t$§!，完成简短国策树后，事件§Y$russia.100.t$§!将使§Y$SOV_alexei_navalny$§!上台。\n\n在§8自民党§!路线中，需选择§8鹰派§!分支。战败后触发事件§Y$russia.801.t$§!，完成简短国策线后，事件§Y$russia.802.t$§!后，§Y$SOV_alexei_navalny$§!将会上台。"
 evgeny_prigozhin_text: "§R首先需在§Y自定义游戏规则§!中§Y启用§!§nPMC“瓦格纳”§!路线。§!\n\n要上台，需在§B$SOV_dmitry_medvedev$§!路线中§R输掉§!§1第一次欧陆战争§!。战败后不久将触发事件§Y$russia.444.t$§!和§Y$russia.445.t$§!，在后者中选择§Y$russia.445.a$§!，最终§Y普里戈任将获胜§!。"


 #GER
 die_linke_text: "2021、2025等年份将举行§Y议会选举§!，§Y$BAY_libertarian_socialist_party_short$§!的支持率§G高于§!其他§Y所有政党§!，且该党§R未被禁止§!，方可§Y胜选§!。\n\n该党有两位总理候选人: \n\n1. §Y$GER_bodo_ramelow_char$§! - 需要让§Y$BAY_libertarian_socialist_party_short$§!在§Y2021年大选§!中§G获胜§!。\n\n2. §Y$GER_heidi_reichinnek_hog$§! - 需要让§Y$BAY_libertarian_socialist_party_short$§!在§Y2025年及后续选举§!中§G获胜§!。"
